[workspace]
resolver = "2"
members = ["sim", "ffi", "client"]
default-members = ["sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["OpenFront AI"]

[workspace.dependencies]
openfront-sim = { path = "sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
byteorder = "1"
rayon = "1.10"
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
